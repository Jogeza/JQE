name: Validate JQE
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv venv
      - run: ./venv/Scripts/python.exe -m pip install -r requirements.txt
      - run: ./venv/Scripts/python.exe tools/check_backend_groups.py --output reports/ci-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-validation
          path: reports/ci-backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
